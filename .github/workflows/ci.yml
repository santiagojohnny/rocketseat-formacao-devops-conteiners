name: CI

on: 
  push:
    branches:
      - main

jobs:
  build:
    name: 'Build and Push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 18, 20 ] # Note: Node 16 is End-of-Life and unsupported in setup-node@v4

    steps: 
      - uses: actions/checkout@v4

      - name: Setup node | ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - run: yarn
      - run: yarn run test

      - name: Build docker image
        run: docker build -t api-rocket:latest .